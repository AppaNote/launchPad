<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LaunchPad</title>
<style>
/* Aurora — default theme. Every theme below only re-declares these variables. */
:root,
[data-theme="aurora"]{
  --glass: rgba(255,255,255,.10);
  --glass-strong: rgba(255,255,255,.18);
  --stroke: rgba(255,255,255,.22);
  --text: #eaf0ff;
  --muted: rgba(234,240,255,.62);
  --accent: #7fd3ff;
  --accent2: #b79bff;
  --accent-soft: rgba(127,211,255,.18);
  --on-accent: #06121c;
  --page: #05070f;
  --glow-a: rgba(127,211,255,.35);
  --glow-b: rgba(183,155,255,.33);
  --glow-c: rgba(74,255,206,.20);
  --wash: linear-gradient(160deg,#070b16,#0b1020 45%,#070a14);
  --sheen-1: rgba(255,255,255,.15);
  --sheen-2: rgba(255,255,255,.055);
  --sheen-hover: rgba(255,255,255,.26);
  --radius: 18px;
  --shadow: 0 10px 40px rgba(0,0,0,.35);
}

[data-theme="sunny"]{
  --glass: rgba(255,250,228,.30);
  --glass-strong: rgba(255,250,228,.45);
  --stroke: rgba(255,255,255,.50);
  --text: #2b2005;
  --muted: rgba(43,32,5,.62);
  --accent: #2f6bff;
  --accent2: #5b8cff;
  --accent-soft: rgba(47,107,255,.16);
  --on-accent: #ffffff;
  --page: #f2c230;
  --glow-a: rgba(255,255,255,.55);
  --glow-b: rgba(255,236,170,.55);
  --glow-c: rgba(255,160,30,.35);
  --wash: linear-gradient(160deg,#ffdb5c,#f6bd2c 55%,#eca31a);
  --sheen-1: rgba(255,255,255,.40);
  --sheen-2: rgba(255,255,255,.16);
  --sheen-hover: rgba(255,255,255,.55);
  --shadow: 0 10px 30px rgba(120,80,0,.18);
}
[data-theme="sunny"] .qmenu{background:linear-gradient(180deg, rgba(255,246,212,.97), rgba(255,233,170,.97))}
[data-theme="sunny"] .icon-btn{background:rgba(255,255,255,.75);color:#2b2005}
[data-theme="sunny"] .icon-btn:hover{background:#fff}
[data-theme="sunny"] .toast{background:rgba(255,248,225,.96)}
[data-theme="sunny"] .greeting h2,[data-theme="sunny"] .greeting p{text-shadow:0 1px 10px rgba(255,255,255,.35)}
[data-theme="sunny"] .search,[data-theme="sunny"] .field input,
[data-theme="sunny"] .field select,[data-theme="sunny"] .field textarea{background:rgba(255,255,255,.45)}
[data-theme="sunny"] .modal{background:linear-gradient(180deg, rgba(255,246,212,.92), rgba(255,233,170,.90))}
[data-theme="sunny"] .bg::after{background-image:radial-gradient(rgba(255,255,255,.18) 1px, transparent 1px)}
[data-theme="sunny"] body.has-image .bg::after{
  background:linear-gradient(180deg, rgba(255,214,90,.10), rgba(160,100,0,.18))}

[data-theme="gold"]{
  --glass: rgba(255,226,160,.10);
  --glass-strong: rgba(255,226,160,.18);
  --stroke: rgba(255,214,140,.28);
  --text: #fbf1dc;
  --muted: rgba(251,241,220,.62);
  --accent: #f2c14e;
  --accent2: #d9a01f;
  --accent-soft: rgba(242,193,78,.20);
  --on-accent: #241a05;
  --page: #0d0a04;
  --glow-a: rgba(242,193,78,.22);
  --glow-b: rgba(198,138,26,.20);
  --glow-c: rgba(255,226,160,.10);
  --wash: linear-gradient(160deg,#0b0803,#130e04 45%,#070502);
  --sheen-1: rgba(255,230,175,.17);
  --sheen-2: rgba(255,230,175,.05);
  --sheen-hover: rgba(255,230,175,.30);
}

[data-theme="emerald"]{
  --glass: rgba(255,255,255,.10);
  --glass-strong: rgba(255,255,255,.18);
  --stroke: rgba(180,255,220,.22);
  --text: #e6fff4;
  --muted: rgba(230,255,244,.62);
  --accent: #57e8ae;
  --accent2: #29b6c9;
  --accent-soft: rgba(87,232,174,.18);
  --on-accent: #04150f;
  --page: #040d0a;
  --glow-a: rgba(87,232,174,.30);
  --glow-b: rgba(41,182,201,.28);
  --glow-c: rgba(120,255,214,.16);
  --wash: linear-gradient(160deg,#05130f,#071a17 45%,#040f0c);
}

[data-theme="rose"]{
  --glass: rgba(255,255,255,.10);
  --glass-strong: rgba(255,255,255,.18);
  --stroke: rgba(255,200,215,.24);
  --text: #fdeaf1;
  --muted: rgba(253,234,241,.62);
  --accent: #ff9ec0;
  --accent2: #c07bff;
  --accent-soft: rgba(255,158,192,.18);
  --on-accent: #1d0713;
  --page: #0c050a;
  --glow-a: rgba(255,158,192,.30);
  --glow-b: rgba(192,123,255,.28);
  --glow-c: rgba(255,214,120,.14);
  --wash: linear-gradient(160deg,#150812,#1b0a18 45%,#0e0510);
}

[data-theme="slate"]{
  --glass: rgba(255,255,255,.08);
  --glass-strong: rgba(255,255,255,.14);
  --stroke: rgba(255,255,255,.18);
  --text: #e8ecf2;
  --muted: rgba(232,236,242,.58);
  --accent: #9fb4cc;
  --accent2: #6d86a3;
  --accent-soft: rgba(159,180,204,.18);
  --on-accent: #0b1017;
  --page: #080a0d;
  --glow-a: rgba(159,180,204,.20);
  --glow-b: rgba(109,134,163,.18);
  --glow-c: rgba(255,255,255,.06);
  --wash: linear-gradient(160deg,#0b0e13,#11151c 45%,#090b10);
}

*{box-sizing:border-box}
html,body{height:100%}
html{scrollbar-gutter:stable}
body{
  margin:0;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color:var(--text);
  background:var(--page);
  -webkit-font-smoothing:antialiased;
}
.bg{
  position:fixed; inset:0; z-index:-1;
  background:
    radial-gradient(60vw 60vw at 12% 8%, var(--glow-a), transparent 60%),
    radial-gradient(55vw 55vw at 88% 12%, var(--glow-b), transparent 60%),
    radial-gradient(70vw 70vw at 50% 100%, var(--glow-c), transparent 60%),
    var(--wash);
  filter:saturate(1.1);
}
.bg::after{
  content:""; position:absolute; inset:0;
  background-image:radial-gradient(rgba(255,255,255,.06) 1px, transparent 1px);
  background-size:22px 22px;
  mask-image:radial-gradient(70% 70% at 50% 40%, #000, transparent);
}

/* Custom background photo: panels stay frosted so the photo shows through as soft colour. */
body.has-image .bg{
  background:var(--bg-image) center/cover no-repeat;
  filter:blur(var(--bg-blur,0px)) saturate(1.05);
  transform:scale(1.06);
}
body.has-image .bg::after{
  background-image:none; mask-image:none; -webkit-mask-image:none;
  background:linear-gradient(180deg, rgba(0,0,0,.22), rgba(0,0,0,.42));
}
body.has-image .glass{
  background:linear-gradient(180deg, rgba(14,18,30,.46), rgba(14,18,30,.32));
  background:linear-gradient(180deg,
    color-mix(in srgb, var(--page) 48%, transparent),
    color-mix(in srgb, var(--page) 32%, transparent));
}
body.has-image .card,body.has-image .arrow{
  background:color-mix(in srgb, var(--page) 44%, transparent);
  backdrop-filter:blur(22px) saturate(150%); -webkit-backdrop-filter:blur(22px) saturate(150%);
}

.glass{
  background:linear-gradient(180deg, var(--sheen-1), var(--sheen-2));
  border:1px solid var(--stroke);
  backdrop-filter: blur(22px) saturate(150%);
  -webkit-backdrop-filter: blur(22px) saturate(150%);
  box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,.28);
}

/* Layout: sidebar + content */
.shell{display:flex;min-height:100vh}
.sidebar{
  position:fixed; left:18px; top:50%; transform:translateY(-50%); z-index:35;
  padding:10px; border-radius:40px;
  display:flex; flex-direction:column; align-items:center; gap:10px;
}
.content{flex:1;min-width:0;padding:16px 26px 28px 108px}

.brand{display:flex;align-items:center;gap:8px;margin-bottom:4px}
.brand h1{font-size:12px;margin:0;letter-spacing:1.6px;font-weight:700;text-transform:uppercase;color:var(--muted)}
.dot{width:12px;height:12px;border-radius:50%;
  background:linear-gradient(135deg,var(--accent),var(--accent2));
  box-shadow:0 0 16px var(--accent)}

.tabs{display:flex;flex-direction:column;gap:10px}
.tab{
  width:50px;height:50px;border-radius:50%;display:grid;place-items:center;padding:0;
  border:1px solid rgba(255,255,255,.35);background:rgba(255,255,255,.22);color:var(--text);
  cursor:pointer;font-family:inherit;transition:.2s;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.4), 0 4px 12px rgba(0,0,0,.10);
}
.tab-ic,.tab > svg{width:20px;height:20px;display:inline-grid}
.tab-ic svg{width:100%;height:100%}
.tab-label{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tab:hover{background:rgba(255,255,255,.4);transform:scale(1.06)}
.tab.active{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent;
  box-shadow:0 6px 18px var(--accent-soft), inset 0 1px 0 rgba(255,255,255,.35)}

.appearance{
  display:none;position:absolute;left:calc(100% + 12px);bottom:0;width:230px;
  padding:6px 8px 12px;border-radius:20px;
}
.appearance.open{display:block}
body.has-image .appearance.glass,.appearance.glass{background:color-mix(in srgb, var(--page) 92%, transparent)}
.bg-actions{display:flex;gap:6px;padding:0 12px 6px}
.btn.small{padding:6px 10px;font-size:12px;border-radius:10px}
.bg-actions .btn:not(.ghost){flex:1}
.slider{display:flex;align-items:center;gap:10px;padding:6px 12px 0;font-size:12px;color:var(--muted)}
.slider input{flex:1;accent-color:var(--accent)}

/* Header */
.topbar{
  position:relative; z-index:30; /* keeps the ··· menu above the quick links bar */
  display:flex; align-items:center; justify-content:space-between; gap:16px;
}
.greeting h2{margin:0;font-size:24px;font-weight:700;letter-spacing:.2px;text-shadow:0 2px 14px rgba(0,0,0,.35)}
.greeting p{margin:4px 0 0;color:var(--muted);font-size:14px;text-shadow:0 1px 8px rgba(0,0,0,.35)}

/* Summary cards */
.stats{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:14px}
.stat{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:var(--radius);cursor:pointer;
  text-align:left;color:var(--text);font-family:inherit;transition:transform .18s}
.stat:hover{transform:translateY(-2px)}
.stat .ic{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:grid;place-items:center;
  color:var(--accent);background:var(--accent-soft);border:1px solid var(--stroke)}
.stat .ic svg{width:19px;height:19px}
.stat .k{display:block;font-size:13px;color:var(--muted)}
.stat .v{display:block;font-size:19px;font-weight:700;margin-top:2px}

.top-actions{display:flex;align-items:center;gap:8px}
.search{
  width:190px;padding:8px 12px;border-radius:12px;color:var(--text);
  background:rgba(255,255,255,.08);border:1px solid var(--stroke);outline:none;font-size:13px;
}
.search::placeholder{color:var(--muted)}
.search:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.btn{
  border-radius:12px;padding:8px 14px;cursor:pointer;font-size:13px;font-weight:600;
  border:1px solid var(--stroke);background:rgba(255,255,255,.08);color:var(--text);transition:.18s;
}
.btn:hover{background:rgba(255,255,255,.16);transform:translateY(-1px)}
.btn.primary{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger:hover{background:rgba(255,105,120,.22);border-color:rgba(255,105,120,.5)}

.menu-wrap{position:relative}
.menu{position:absolute;right:0;top:44px;border-radius:14px;padding:6px;display:flex;flex-direction:column;min-width:190px;z-index:30}
.menu button{background:transparent;border:0;color:var(--text);text-align:left;padding:9px 12px;border-radius:10px;cursor:pointer;font-size:13px}
.menu button:hover{background:rgba(255,255,255,.12)}
.menu-label{font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;color:var(--muted);padding:8px 12px 4px;font-weight:600}
.swatches{display:flex;gap:6px;padding:0 12px 8px}
.swatch{width:24px;height:24px;border-radius:50%;cursor:pointer;padding:0;
  border:2px solid transparent;box-shadow:0 0 0 1px var(--stroke);transition:.18s}
.swatch:hover{transform:scale(1.08)}
.swatch.active{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}

/* Quick links */
.quicklinks{
  margin:12px 0 0;padding:6px 12px;border-radius:var(--radius);
  display:flex;gap:6px;flex-wrap:wrap;align-items:center;
  position:relative;z-index:25; /* hover menus must sit above the launcher panels */
}
.qlink{
  display:inline-flex;align-items:center;gap:8px;padding:6px 12px;border-radius:11px;
  color:var(--muted);text-decoration:none;font-size:13px;border:1px solid transparent;transition:.18s;
}
button.qlink{background:transparent;cursor:pointer;font:inherit;font-size:13px;color:var(--muted)}
button.qlink.add{border:1px dashed var(--stroke)}
.qlink:hover{color:var(--text);background:rgba(255,255,255,.12);border-color:var(--stroke)}
.qlink .mini{opacity:0;font-size:11px;transition:.18s}
.qlink:hover .mini{opacity:.8}
.mini{background:transparent;border:0;color:inherit;cursor:pointer;padding:0;display:inline-grid;place-items:center}
.mini svg{width:13px;height:13px}

.qgroup{position:relative}
.qgroup .caret{font-size:10px;opacity:.7}
.qmenu{
  display:none;position:absolute;left:0;top:100%;margin-top:0;z-index:40;
  min-width:210px;max-height:60vh;overflow:auto;padding:6px;border-radius:14px;
  flex-direction:column;gap:2px;
  background:linear-gradient(180deg, rgba(26,32,54,.96), rgba(16,20,36,.96));
  box-shadow:var(--shadow);
}
.qgroup:hover .qmenu,.qgroup.open .qmenu{display:flex}
.qgroup::after{content:'';position:absolute;left:0;right:0;top:100%;height:8px}
body.has-image .qmenu.glass,.qmenu.glass{background:linear-gradient(180deg, rgba(26,32,54,.97), rgba(16,20,36,.97))}
[data-theme="sunny"] .qmenu.glass,[data-theme="sunny"] body.has-image .qmenu.glass{background:linear-gradient(180deg, rgba(255,246,212,.98), rgba(255,233,170,.98))}
.qitem{
  display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  background:transparent;border:0;color:var(--text);font:inherit;font-size:13px;
  padding:8px 10px;border-radius:10px;cursor:pointer;
}
.qitem:hover{background:rgba(255,255,255,.12)}
.qitem-name{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qitem .mini{opacity:0}
.qitem:hover .mini{opacity:.8}
.qitem.add{color:var(--muted);border:1px dashed var(--stroke);margin-top:4px;justify-content:center}

main{padding:14px 0 0}
.view.hidden,.hidden{display:none !important}

/* Launcher pager */
.pager{display:flex;align-items:center;gap:12px}
.arrow{
  flex:0 0 auto;width:38px;height:76px;border-radius:14px;cursor:pointer;font-size:20px;
  color:var(--text);border:1px solid var(--stroke);
  background:linear-gradient(180deg,var(--sheen-1),var(--sheen-2));
  backdrop-filter:blur(18px); transition:.18s;
}
.arrow:hover{background:rgba(255,255,255,.2);transform:scale(1.03)}
.pages{flex:1;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
@media (max-width:900px){.pages{grid-template-columns:1fr}}

.env{border-radius:var(--radius);padding:12px}
.env-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.env-head h3{margin:0;font-size:14px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--muted)}
.env-actions{display:flex;gap:4px;opacity:.5;transition:.18s}
.env:hover .env-actions{opacity:1}

.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(86px,1fr));gap:4px}
.tile{
  position:relative;border-radius:16px;cursor:pointer;color:var(--text);font-family:inherit;
  display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:6px;
  padding:10px 4px 8px;background:transparent;border:1px solid transparent;
  transition:background .18s, border-color .18s;
}
.tile:hover{background:rgba(255,255,255,.12);border-color:var(--stroke)}
.tile .glyph{
  width:52px;height:52px;flex:0 0 52px;border-radius:50%;display:grid;place-items:center;color:#fff;
  background:linear-gradient(145deg,var(--c1,#4facfe),var(--c2,#1f7ae0));
  box-shadow:0 6px 14px rgba(0,0,0,.22), inset 0 1px 0 rgba(255,255,255,.45);
  transition:transform .18s;
}
.tile .glyph svg{width:26px;height:26px}
.tile:hover .glyph{transform:scale(1.07)}
.tile.add .glyph{background:rgba(255,255,255,.16);color:var(--muted);border:1px dashed var(--stroke);box-shadow:none}
.tile .label{font-size:12px;font-weight:600;text-align:center;line-height:1.2;padding:0 2px}
.tile .sub{font-size:10px;color:var(--muted);letter-spacing:.5px;text-transform:uppercase;margin-top:-3px}
.tile-actions{position:absolute;top:6px;right:6px;display:flex;gap:2px;opacity:0;transition:.18s;z-index:2}
.tile:hover .tile-actions{opacity:1}
.icon-btn{
  width:24px;height:24px;border-radius:8px;display:grid;place-items:center;font-size:12px;cursor:pointer;
  background:rgba(8,12,22,.55);border:1px solid var(--stroke);color:var(--text);
}
.icon-btn svg{width:13px;height:13px}
.icon-btn:hover{background:rgba(8,12,22,.85)}
.tile.add{opacity:.75}
.tile.add:hover{opacity:1}

.dots{display:flex;gap:8px;justify-content:center;margin-top:12px}
.pdot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.25);cursor:pointer;border:0}
.pdot.active{background:linear-gradient(135deg,var(--accent),var(--accent2));box-shadow:0 0 10px var(--accent)}

/* Filters */
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px}
.chip{
  padding:7px 14px;border-radius:999px;font-size:12.5px;cursor:pointer;color:var(--muted);
  border:1px solid var(--stroke);background:rgba(255,255,255,.06);transition:.18s;
}
.chip:hover{color:var(--text)}
.chip.active{color:var(--on-accent);background:linear-gradient(135deg,var(--accent),var(--accent2));border-color:transparent}

/* Cards */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:14px}
.card{border-radius:var(--radius);padding:14px 16px;position:relative;transition:.18s;
  background:linear-gradient(180deg,var(--sheen-1),var(--sheen-2));
  border:1px solid var(--stroke);backdrop-filter:blur(18px);
  box-shadow:inset 0 1px 0 rgba(255,255,255,.25), 0 6px 20px rgba(0,0,0,.25);
}
.card:hover{transform:translateY(-2px);border-color:rgba(255,255,255,.4)}
.card h4{margin:0 0 6px;font-size:15px;font-weight:650;padding-right:64px}
.card .tagrow{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
/* Tag tints follow the theme accents; the rgba lines are the fallback for browsers without color-mix. */
.tag{font-size:10.5px;letter-spacing:.6px;text-transform:uppercase;padding:3px 9px;border-radius:999px;
  background:rgba(255,255,255,.10);border:1px solid var(--stroke);color:var(--accent);
  background:color-mix(in srgb, var(--accent) 16%, transparent);
  border-color:color-mix(in srgb, var(--accent) 35%, transparent)}
.tag.alt{color:var(--accent2);
  background:color-mix(in srgb, var(--accent2) 16%, transparent);
  border-color:color-mix(in srgb, var(--accent2) 35%, transparent)}
.kv{display:flex;gap:8px;font-size:13px;margin:3px 0;color:var(--muted)}
.kv b{color:var(--text);font-weight:600;min-width:74px;font-size:12px;text-transform:uppercase;letter-spacing:.4px;opacity:.7}
.kv span{word-break:break-all}
.copy{cursor:pointer;border:0;background:transparent;color:var(--accent);font-size:11px;padding:0 4px}
.card a.link{color:var(--accent);text-decoration:none;font-size:13px;word-break:break-all}
.card a.link:hover{text-decoration:underline}
.card .note{font-size:12.5px;color:var(--muted);margin-top:8px;line-height:1.45}

/* Resource cards */
.res-card{padding:0;overflow:hidden;cursor:pointer;display:flex;flex-direction:column}
.res-card .thumb{
  position:relative;aspect-ratio:16/9;overflow:hidden;
  background:linear-gradient(135deg, var(--accent-soft), var(--glass-strong));
  border-bottom:1px solid var(--stroke);
}
.res-card .thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .35s}
.res-card:hover .thumb img{transform:scale(1.04)}
.res-card .thumb.fallback{display:grid;place-items:center}
.res-card .monogram{font-size:40px;font-weight:700;color:rgba(255,255,255,.75);letter-spacing:1px}
.res-card .play{position:absolute;inset:0;display:grid;place-items:center;color:#fff;pointer-events:none}
.res-card .play svg{width:46px;height:46px;filter:drop-shadow(0 2px 8px rgba(0,0,0,.5))}
.res-body{padding:12px 14px 14px}
.res-card h4{margin:0 0 6px;padding-right:0;font-size:14.5px;line-height:1.35;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.res-card .source{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted);margin-bottom:8px}
.res-card .favicon{border-radius:4px;flex:0 0 auto}
.res-card .card-actions{top:10px;right:10px;z-index:2}
.res-card .tagrow{margin-bottom:0}
.card-actions{position:absolute;top:12px;right:12px;display:flex;gap:4px;opacity:0;transition:.18s}
.card:hover .card-actions{opacity:1}
.empty{grid-column:1/-1;color:var(--muted);text-align:center;padding:60px 0;font-size:14px}

/* Modal */
.overlay{position:fixed;inset:0;z-index:60;background:rgba(3,6,14,.6);backdrop-filter:blur(6px);
  display:grid;place-items:center;padding:20px}
.modal{width:min(560px,100%);border-radius:22px;max-height:88vh;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--stroke)}
.modal-head h2{margin:0;font-size:16px;font-weight:650}
.modal-body{padding:16px 18px;overflow:auto;display:flex;flex-direction:column;gap:12px}
.modal-foot{display:flex;justify-content:flex-end;gap:8px;padding:14px 18px;border-top:1px solid var(--stroke)}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{
  padding:10px 12px;border-radius:12px;border:1px solid var(--stroke);
  background:rgba(255,255,255,.08);color:var(--text);font-size:14px;outline:none;font-family:inherit;
}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field select option{background:var(--page)}
.icon-preview{width:34px;height:34px;color:var(--accent);margin-top:2px}
.icon-preview svg{width:100%;height:100%}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.hint{font-size:11.5px;color:var(--muted)}

.toast{
  position:fixed;bottom:26px;left:50%;transform:translateX(-50%);
  padding:11px 20px;border-radius:14px;font-size:13px;z-index:80;
  background:rgba(12,18,32,.9);border:1px solid var(--stroke);backdrop-filter:blur(14px);
}

@media (max-width:900px){
  .shell{flex-direction:column}
  .sidebar{position:sticky;top:8px;left:auto;transform:none;flex-direction:row;align-self:center;margin:8px auto 0}
  .tabs{flex-direction:row}
  .appearance{left:auto;right:0;bottom:auto;top:calc(100% + 10px)}
  .content{padding:14px 14px 50px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .topbar{flex-wrap:wrap}
}

/* Notes library (portrait pages, e-reader style) */
.notes-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:22px 18px}
.note-card{position:relative;display:flex;flex-direction:column;gap:6px;cursor:pointer;background:none;border:0;padding:0;
  color:var(--text);font:inherit;text-align:left;outline:none}
.note-page{aspect-ratio:3/4;border-radius:12px;overflow:hidden;background:#fdfbf5;color:#222;
  border:1px solid rgba(255,255,255,.6);box-shadow:0 8px 22px rgba(0,0,0,.18);transition:transform .18s, box-shadow .18s}
.note-card:hover .note-page,.note-card:focus-visible .note-page{transform:translateY(-3px);box-shadow:0 14px 30px rgba(0,0,0,.24)}
.note-thumb{padding:14px 14px 0;font-size:7px;line-height:1.45;pointer-events:none}
.note-thumb a{pointer-events:none}
.note-new .note-page{display:grid;place-items:center;background:rgba(255,255,255,.22);border:1.5px dashed var(--stroke);
  color:var(--muted);box-shadow:none}
.note-new .note-page svg{width:38px;height:38px}
.note-name{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 2px}
.note-date{font-size:11px;color:var(--muted);margin-top:-4px;padding:0 2px}
.note-card .tile-actions{top:8px;right:8px}
.note-card:hover .tile-actions{opacity:1}

/* Markdown typography (preview, thumbnails, PDF) */
.md{line-height:1.65;word-wrap:break-word}
.md > :first-child{margin-top:0}
.md h1,.md h2,.md h3,.md h4,.md h5,.md h6{line-height:1.25;margin:1.2em 0 .5em;font-weight:700}
.md h1{font-size:2em;padding-bottom:.25em;border-bottom:1px solid rgba(127,127,127,.3)}
.md h2{font-size:1.5em;padding-bottom:.2em;border-bottom:1px solid rgba(127,127,127,.2)}
.md h3{font-size:1.25em}.md h4{font-size:1.05em}.md h5,.md h6{font-size:.95em;opacity:.8}
.md p,.md ul,.md ol,.md blockquote,.md pre,.md table{margin:0 0 .9em}
.md ul,.md ol{padding-left:1.6em}
.md li{margin:.2em 0}
.md li.task{list-style:none;margin-left:-1.3em}
.md li.task input{margin:0 .4em 0 0;vertical-align:-.1em}
.md a{color:var(--accent);text-decoration:underline;text-underline-offset:2px}
.md code{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:.88em;padding:.1em .35em;border-radius:5px;background:rgba(127,127,127,.18)}
.md pre{padding:12px 14px;border-radius:10px;background:rgba(20,24,36,.86);color:#e8ecf5;overflow:auto}
.md pre code{background:none;padding:0;font-size:.85em;color:inherit}
.md blockquote{margin-left:0;padding:.2em 1em;border-left:4px solid var(--accent);background:rgba(127,127,127,.1);border-radius:0 8px 8px 0}
.md hr{border:0;border-top:1px solid rgba(127,127,127,.35);margin:1.4em 0}
.md img{max-width:100%;border-radius:8px}
.md table{border-collapse:collapse;display:block;overflow:auto}
.md th,.md td{border:1px solid rgba(127,127,127,.35);padding:6px 12px}
.md th{background:rgba(127,127,127,.14)}
.md mark{background:#ffe066;color:#222;padding:0 .2em;border-radius:3px}
.md-placeholder{color:var(--muted);font-style:italic}
.note-thumb.md a{color:#2f6bff}

/* Markdown editor */
body.editing{overflow:hidden}
.md-editor{position:fixed;inset:0;z-index:55;display:flex;flex-direction:column;gap:10px;padding:14px;--split:50%}
.md-editor::before{content:'';position:absolute;inset:0;z-index:-1;background:color-mix(in srgb, var(--page) 55%, transparent);
  backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px)}
.md-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 10px;border-radius:16px;position:relative;z-index:2}
.md-title{flex:1;min-width:140px;font-weight:650;font-size:14px;display:flex;align-items:center;gap:6px;overflow:hidden;white-space:nowrap}
.md-title span:first-child{overflow:hidden;text-overflow:ellipsis}
.md-dirty{color:#e8590c;font-size:11px}
.md-tools{display:flex;gap:2px}
.md-tools button,.seg button{min-width:30px;height:30px;padding:0 8px;border-radius:8px;border:1px solid transparent;background:transparent;
  color:var(--text);font:inherit;font-size:13px;cursor:pointer}
.md-tools button:hover,.seg button:hover{background:rgba(255,255,255,.3);border-color:var(--stroke)}
.seg{display:flex;padding:2px;border-radius:10px;border:1px solid var(--stroke);background:rgba(255,255,255,.18)}
.seg button.active{background:linear-gradient(135deg,var(--accent),var(--accent2));color:var(--on-accent)}
.md-bar .menu{top:38px}
.md-body{flex:1;min-height:0;border-radius:18px;display:grid;grid-template-columns:var(--split) 10px 1fr;overflow:hidden}
#mdInput{resize:none;border:0;outline:none;padding:22px 24px;background:rgba(255,255,255,.35);color:var(--text);
  font:14px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace;tab-size:2}
.md-divider{cursor:col-resize;background:rgba(127,127,127,.12);position:relative;touch-action:none}
.md-divider::after{content:'';position:absolute;left:3px;right:3px;top:50%;height:44px;margin-top:-22px;border-radius:4px;background:var(--muted);opacity:.5}
.md-divider:hover,.md-divider.dragging{background:var(--accent-soft)}
.md-preview{overflow:auto;padding:22px 30px;background:rgba(255,255,255,.55);color:#1f1d18;font-size:15px}
.md-preview a{color:#2f5fe0}
.md-editor[data-mode="edit"] .md-body{grid-template-columns:1fr}
.md-editor[data-mode="edit"] .md-divider,.md-editor[data-mode="edit"] .md-preview{display:none}
.md-editor[data-mode="read"] .md-body{grid-template-columns:1fr}
.md-editor[data-mode="read"] #mdInput,.md-editor[data-mode="read"] .md-divider,.md-editor[data-mode="read"] .md-tools{display:none}
.md-editor[data-mode="read"] .md-preview{padding:34px max(30px, calc(50% - 420px))}
@media (max-width:900px){ .md-tools{display:none} }

/* PDF export prints only the rendered note */
#printArea{display:none}
@media print{
  html,body{background:#fff !important}
  body > *:not(#printArea){display:none !important}
  #printArea{display:block;color:#111;font-size:12pt}
  #printArea .md a{color:#1a4fd6}
  #printArea .md pre{background:#f4f4f4;color:#111;border:1px solid #ddd}
  #printArea .md h1,#printArea .md h2,#printArea .md pre,#printArea .md table,#printArea .md img{break-inside:avoid}
}

</style>
</head>
<body>
<div class="bg" id="bg"></div>

<div class="shell">
<aside class="sidebar glass">
  <nav class="tabs" id="tabs">
    <button class="tab active" data-view="launcher" data-icon="grid" title="Launcher" aria-label="Launcher">Launcher</button>
    <button class="tab" data-view="databases" data-icon="database" title="Databases" aria-label="Databases">Databases</button>
    <button class="tab" data-view="resources" data-icon="book" title="Resources" aria-label="Resources">Resources</button>
    <button class="tab" data-view="notes" data-icon="note" title="Notes" aria-label="Notes">Notes</button>
  </nav>
  <button class="tab" id="settingsBtn" type="button" title="Settings & backup" aria-label="Settings and backup"></button>

  <div class="appearance glass" id="appearance">
    <div class="menu-label">Theme</div>
    <div class="swatches" id="themePicker"></div>
    <div class="menu-label">Background</div>
    <div class="bg-actions">
      <button class="btn small" id="bgUpload" type="button">Upload</button>
      <button class="btn small" id="bgUrl" type="button">URL</button>
      <button class="btn small ghost" id="bgClear" type="button" title="Remove background image">&times;</button>
    </div>
    <label class="slider">
      <span>Blur</span>
      <input type="range" id="bgBlur" min="0" max="24" step="1" />
    </label>
    <div class="menu-label">Backup</div>
    <div class="bg-actions">
      <button class="btn small" id="bkExport" type="button" title="Download every link, database, resource and note as one .json file">Export</button>
      <button class="btn small" id="bkImport" type="button" title="Restore from a .json backup">Import</button>
    </div>
  </div>
</aside>

<div class="content">
<header class="topbar">
  <div class="greeting">
    <div class="brand"><span class="dot"></span><h1>LaunchPad</h1></div>
    <h2 id="greeting">Welcome back</h2>
    <p id="subGreeting">Here's your workspace.</p>
  </div>

  <div class="top-actions">
    <input id="search" class="search" type="search" placeholder="Search…" autocomplete="off" />
    <button id="addBtn" class="btn primary" title="Add item">+ Add</button>
    <div class="menu-wrap">
      <button id="moreBtn" class="btn ghost" title="More">···</button>
      <div id="moreMenu" class="menu glass hidden">
        <button data-action="export">Export backup (.json)</button>
        <button data-action="import">Import backup…</button>
        <button data-action="reset">Reset to defaults</button>
      </div>
    </div>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="quicklinks glass" id="quickLinks"></div>

<main>
  <!-- LAUNCHER -->
  <section class="view" id="view-launcher">
    <div class="pager">
      <button class="arrow" id="prevPage" aria-label="Previous page">&#10094;</button>
      <div class="pages" id="pages"></div>
      <button class="arrow" id="nextPage" aria-label="Next page">&#10095;</button>
    </div>
    <div class="dots" id="pageDots"></div>
  </section>

  <!-- DATABASES -->
  <section class="view hidden" id="view-databases">
    <div class="filters" id="dbFilters"></div>
    <div class="cards" id="dbList"></div>
  </section>

  <!-- NOTES -->
  <section class="view hidden" id="view-notes">
    <div class="notes-head">
      <span class="hint">Markdown files saved in this browser. Drop .md files here to add them.</span>
      <button class="btn small" id="openMd" type="button">Open .md file…</button>
    </div>
    <div class="notes-grid" id="notesList"></div>
    <div class="empty hidden" id="notesEmpty">No notes yet — press + to write one.</div>
  </section>

  <!-- RESOURCES -->
  <section class="view hidden" id="view-resources">
    <div class="filters" id="resFilters"></div>
    <div class="cards" id="resList"></div>
  </section>
</main>
</div>
</div>

<!-- Modal -->
<div class="overlay hidden" id="overlay">
  <div class="modal glass" role="dialog" aria-modal="true">
    <div class="modal-head">
      <h2 id="modalTitle">Add item</h2>
      <button class="btn ghost" id="modalClose">&times;</button>
    </div>
    <form id="modalForm" class="modal-body"></form>
    <div class="modal-foot">
      <button class="btn ghost" id="modalCancel" type="button">Cancel</button>
      <button class="btn primary" id="modalSave" type="button">Save</button>
    </div>
  </div>
</div>

<!-- Markdown editor -->
<div class="md-editor hidden" id="mdEditor" data-mode="split">
  <div class="md-bar glass">
    <button class="btn small ghost" id="mdBack" type="button" title="Back to notes (Esc)">&larr; Notes</button>
    <div class="md-title"><span id="mdName"></span><span id="mdDirty" class="md-dirty hidden" title="Unsaved changes">&#9679;</span></div>
    <div class="md-tools" id="mdTools"></div>
    <div class="seg" id="mdModes">
      <button type="button" data-mode="edit">Edit</button>
      <button type="button" data-mode="split">Split</button>
      <button type="button" data-mode="read">Read</button>
    </div>
    <button class="btn small primary" id="mdSave" type="button" title="Save (Ctrl+S)">Save</button>
    <button class="btn small" id="mdSaveAs" type="button" title="Save As (Ctrl+Shift+S)">Save As</button>
    <div class="menu-wrap">
      <button class="btn small" id="mdExportBtn" type="button">Export &#9662;</button>
      <div class="menu glass hidden" id="mdExportMenu">
        <button type="button" data-x="pdf">PDF (.pdf)</button>
        <button type="button" data-x="md">Markdown (.md)</button>
      </div>
    </div>
  </div>
  <div class="md-body glass" id="mdBody">
    <textarea id="mdInput" spellcheck="true" placeholder="# Title&#10;&#10;Write **Markdown** here…"></textarea>
    <div class="md-divider" id="mdDivider" title="Drag to resize · double-click to reset"></div>
    <div class="md-preview md" id="mdPreview"></div>
  </div>
</div>
<div id="printArea"></div>

<div id="toast" class="toast hidden"></div>
<input type="file" id="mdFile" accept=".md,.markdown,.mdown,.txt,text/markdown,text/plain" multiple class="hidden" />
<input type="file" id="importFile" accept="application/json" class="hidden" />
<input type="file" id="bgFile" accept="image/*" class="hidden" />

<script>
/* LaunchPad — local-first launcher, database registry and resource library.
   All data lives in localStorage and is never removed unless the user deletes it. */

const STORE_KEY = 'launchpad.v1';

const ICON_NAMES = Object.keys(ICONS);
/* App-icon gradient per glyph, iPad style. */
const ICON_COLORS = {
  globe: ['#4facfe', '#1f7ae0'], grid: ['#a18cd1', '#6f4fe8'], money: ['#43e97b', '#16a35a'],
  tools: ['#f7971e', '#e0600f'], chart: ['#5ee7df', '#2484d0'], docs: ['#ff9a9e', '#e0507f'],
  clock: ['#ffb347', '#f2763b'], org: ['#7fd6ff', '#3b74e8'], robot: ['#c471f5', '#7a3fe0'],
  database: ['#7b93c7', '#3a4c86'], health: ['#ff6a88', '#d9284a'], folder: ['#ffd24a', '#e39a07'],

/* v2 moved the Intranet quick link to the front of the bar. */
function intranetFirst(groups) {
  const i = groups.findIndex((g) => g.name.trim().toLowerCase() === 'intranet');
  if (i > 0) groups.unshift(groups.splice(i, 1)[0]);
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return defaults();
    const data = JSON.parse(raw);
    const quickLinks = (data.quickLinks || []).map(normalizeQuickLink);
    if ((data.layoutVersion || 1) < 2) intranetFirst(quickLinks);
    return {
      layoutVersion: LAYOUT_VERSION,
      quickLinks,
      environments: data.environments || [],
      databases: data.databases || [],
      resources: data.resources || [],
      theme: THEMES.some((t) => t.id === data.theme) ? data.theme : DEFAULT_THEME
    };
  } catch (e) {
    console.error('Could not read saved data, starting fresh copy in memory.', e);
    return defaults();
  }
}
function save() {
  localStorage.setItem(STORE_KEY, JSON.stringify(state));
}

/* A quick link is a group: it can open its own URL and/or hold child links. */
function normalizeQuickLink(q) {
  return {
    id: q.id || uid(),
    name: q.name || '',
    url: q.url || '',
    items: (Array.isArray(q.items) ? q.items : []).map((i) => ({ id: i.id || uid(), name: i.name || '', url: i.url || '' }))
  };
}
function findQuickGroup(id) {
  return state.quickLinks.find((g) => g.id === id) || null;
}
function findQuickItem(id) {
  for (const g of state.quickLinks) {
    const it = g.items.find((i) => i.id === id);
    if (it) return { group: g, item: it };
  }
  return null;
}

/* ---------- helpers ---------- */
const $ = (sel) => document.querySelector(sel);
const el = (tag, cls, html) => {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (html != null) n.innerHTML = html;
  return n;
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) =>
  ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function normalizeUrl(u) {
  const s = (u || '').trim();
  if (!s) return '';
  if (/^([a-z]+:)?\/\//i.test(s) || /^(mailto|tel|file):/i.test(s)) return s;
  return 'https://' + s;
}
function openUrl(u) {
  const url = normalizeUrl(u);
  if (!url) return toast('No URL set — use Edit to add one.');
  window.open(url, '_blank', 'noopener');
}
let toastTimer;
function toast(msg) {
  const t = $('#toast');
  t.textContent = msg;
  t.classList.remove('hidden');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => t.classList.add('hidden'), 2200);
}
/* ---------- link metadata (derived client-side; no server, no CORS fetches) ---------- */
function parseUrl(u) {
  try { return new URL(normalizeUrl(u)); } catch (e) { return null; }
}
function hostOf(u) {
  return parseUrl(u)?.hostname.replace(/^www\./, '') || '';
}
function youTubeId(u) {
  const p = parseUrl(u);
  if (!p) return '';
  if (/(^|\.)youtu\.be$/.test(p.hostname)) return p.pathname.slice(1).split('/')[0];
  if (/(^|\.)youtube\.com$/.test(p.hostname)) {
    if (p.searchParams.get('v')) return p.searchParams.get('v');
    const m = p.pathname.match(/\/(embed|shorts|live)\/([^/?#]+)/);
    if (m) return m[2];
  }
  return '';
}
function thumbnailFor(r) {
  if (r.thumbnail) return normalizeUrl(r.thumbnail);
  const id = youTubeId(r.url);
  return id ? `https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg` : '';
}
function faviconCandidates(u) {
  const p = parseUrl(u);
  if (!p) return [];
  return [
    `https://www.google.com/s2/favicons?sz=64&domain=${encodeURIComponent(p.hostname)}`,
    `${p.origin}/favicon.ico`
  ];
}
/* Turns ".../2024/05/tuning-sql-queries?utm=x" into "Tuning Sql Queries". */
function titleFromUrl(u) {
  const p = parseUrl(u);
  if (!p) return '';
  const q = p.searchParams.get('q') || p.searchParams.get('search') || p.searchParams.get('query');
  if (q) return `${hostOf(u)}: ${q}`.slice(0, 90);
  if (youTubeId(u)) return 'YouTube video';
  const slug = p.pathname.split('/').filter(Boolean).pop();
  if (!slug) return hostOf(u);
  const words = decodeURIComponent(slug)
    .replace(/\.(html?|php|aspx?|pdf)$/i, '')
    .replace(/[-_+]+/g, ' ')
    .replace(/\s+/g, ' ')
    .trim();
  if (!words || words.length < 3) return hostOf(u);
  return words.replace(/\b\w/g, (c) => c.toUpperCase()).slice(0, 90);
}

/* YouTube and Vimeo expose CORS-enabled oEmbed, so a real title can be pulled in
   without a backend. Every other site blocks cross-origin reads. */
function oEmbedEndpoint(u) {
  const p = parseUrl(u);
  if (!p) return '';
  const enc = encodeURIComponent(normalizeUrl(u));
  if (youTubeId(u)) return `https://www.youtube.com/oembed?format=json&url=${enc}`;
  if (/(^|\.)vimeo\.com$/.test(p.hostname)) return `https://vimeo.com/api/oembed.json?url=${enc}`;
  return '';
}
async function enrichResource(r) {
  const endpoint = oEmbedEndpoint(r.url);
  if (!endpoint || r.title) return false;
  try {
    const res = await fetch(endpoint);
    if (!res.ok) return false;
    const meta = await res.json();
    if (!meta.title) return false;
    r.title = meta.title;
    if (!r.thumbnail && meta.thumbnail_url) r.thumbnail = meta.thumbnail_url;
    save();
    return true;
  } catch (e) {
    return false; /* offline or blocked — the derived title stays in place */
  }
}

function matches(...parts) {
  if (!query) return true;
  return parts.filter(Boolean).join(' ').toLowerCase().includes(query);
}

  if (!saveBg()) bg.src = prev;

/* Uploaded photos are downscaled to JPEG so they fit comfortably in localStorage. */
function imageFileToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onerror = reject;
    reader.onload = () => {
      const img = new Image();
      img.onerror = reject;
      img.onload = () => {
        const scale = Math.min(1, BG_MAX_SIDE / Math.max(img.width, img.height));
        const canvas = document.createElement('canvas');
        canvas.width = Math.round(img.width * scale);
        canvas.height = Math.round(img.height * scale);
        canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
        resolve(canvas.toDataURL('image/jpeg', 0.82));
      };
      img.src = reader.result;
    };
    reader.readAsDataURL(file);
  });
}

function quickLinkGroup(g) {
  const grp = el('div', 'qgroup');

  const chip = el('button', 'qlink');
  chip.innerHTML = `<span>${esc(g.name)}</span>
    ${g.items.length ? '<span class="caret">&#9662;</span>' : ''}
    <span class="mini" data-a="edit" title="Edit group">${UI.edit}</span>
    <span class="mini" data-a="del" title="Delete group">${UI.trash}</span>`;
  grp.appendChild(chip);

  const menu = el('div', 'qmenu glass');
  g.items.forEach((it) => {
    const row = el('button', 'qitem');
    row.innerHTML = `<span class="qitem-name">${esc(it.name)}</span>
      <span class="mini" data-a="edit-item" data-id="${it.id}" title="Edit">${UI.edit}</span>
      <span class="mini" data-a="del-item" data-id="${it.id}" title="Delete">${UI.trash}</span>`;
    row.dataset.a = 'open-item';
    row.dataset.id = it.id;
    if (it.url) row.title = normalizeUrl(it.url);
    menu.appendChild(row);
  });
  const addItem = el('button', 'qitem add', '+ Add link');
  addItem.dataset.a = 'add-item';
  menu.appendChild(addItem);
  grp.appendChild(menu);

  grp.addEventListener('click', (e) => {
    const hit = e.target.closest('[data-a]');
    const a = hit?.dataset.a;
    if (a === 'edit') return openModal('quickLink', g);
    if (a === 'del') return removeItem('quickLinks', g.id, g.name);
    if (a === 'add-item') return openModal('quickSubLink', null, { parentId: g.id });
    if (a === 'edit-item') return openModal('quickSubLink', findQuickItem(hit.dataset.id)?.item, { parentId: g.id });
    if (a === 'del-item') return removeQuickItem(g, hit.dataset.id);
    if (a === 'open-item') {
      const it = g.items.find((i) => i.id === hit.dataset.id);
      return openUrl(it?.url);
    }
    if (g.url) return openUrl(g.url);
    if (g.items.length) grp.classList.toggle('open');
    else toast('No URL set — use Edit to add one.');
  });
  grp.addEventListener('mouseleave', () => grp.classList.remove('open'));

  return grp;
}

function removeQuickItem(group, id) {
  const it = group.items.find((i) => i.id === id);
  if (!it || !confirm(`Delete "${it.name}" from ${group.name}?`)) return;
  group.items = group.items.filter((i) => i.id !== id);
  save(); renderQuickLinks(); toast('Deleted');
}

function pageCount() {
  return Math.max(1, Math.ceil(state.environments.length / ENVS_PER_PAGE));

function turnPage(step) {
  const n = pageCount();
  page = ((page + step) % n + n) % n; // wraps in both directions, endlessly

}

function renderLauncher() {
  const total = pageCount();
  if (page >= total) page = 0;
  const pages = $('#pages');
  pages.innerHTML = '';

  const slice = state.environments.slice(page * ENVS_PER_PAGE, page * ENVS_PER_PAGE + ENVS_PER_PAGE);
  if (!slice.length) {
    pages.appendChild(el('div', 'empty', 'No environments yet — use + Add → Environment.'));
  }
  slice.forEach((env) => pages.appendChild(envPanel(env)));

  const dots = $('#pageDots');
  dots.innerHTML = '';
  for (let i = 0; i < total; i++) {
    const d = el('button', 'pdot' + (i === page ? ' active' : ''));
    d.title = 'Page ' + (i + 1);
    d.addEventListener('click', () => { page = i; renderLauncher(); });
    dots.appendChild(d);
  }
}

    <div class="thumb ${thumb ? '' : 'fallback'}">
      ${thumb ? `<img alt="" src="${esc(thumb)}">` : `<div class="monogram">${esc((host || '?')[0].toUpperCase())}</div>`}
      ${isVideo ? `<span class="play">${UI.play}</span>` : ''}
    </div>
    <div class="res-body">
      <h4 title="${esc(normalizeUrl(r.url))}">${esc(title)}</h4>
      <div class="source"><img class="favicon" alt="" width="16" height="16"><span>${esc(host || 'link')}</span></div>
      <div class="tagrow">
        ${r.category ? `<span class="tag alt">${esc(r.category)}</span>` : ''}
        ${(r.tags || '').split(',').map((t) => t.trim()).filter(Boolean)
          .map((t) => `<span class="tag">${esc(t)}</span>`).join('')}
      </div>
      ${r.notes ? `<div class="note">${esc(r.notes)}</div>` : ''}
    </div>`;

  const img = card.querySelector('.thumb img');
  if (img) img.addEventListener('error', () => {
    const box = card.querySelector('.thumb');
    box.classList.add('fallback');
    box.innerHTML = `<div class="monogram">${esc((host || '?')[0].toUpperCase())}</div>`;
  });

  const fav = card.querySelector('.favicon');
  const sources = faviconCandidates(r.url);
  let attempt = 0;
  const tryFavicon = () => {
    if (attempt >= sources.length) { fav.remove(); return; }
    fav.src = sources[attempt++];
  };
  fav.addEventListener('error', tryFavicon);
  tryFavicon();

  card.addEventListener('click', (e) => {
    const a = e.target.closest('button')?.dataset.a;
    if (a === 'edit') return openModal('resource', r);
    if (a === 'del') return removeItem('resources', r.id, r.title || title);
    openUrl(r.url);
  });
  return card;
}

function copyText(text) {
  navigator.clipboard?.writeText(text).then(() => toast('Copied: ' + text)).catch(() => toast('Copy failed'));
}

let modalCtx = null; // { kind, item, extra }

function openModal(kind, item = null, extra = {}) {
  if (!kind) return;
  modalCtx = { kind, item, extra };
  const schema = SCHEMAS[kind];
  $('#modalTitle').textContent = schema.heading || (item ? 'Edit ' : 'Add ') + schema.title.toLowerCase();

  const form = $('#modalForm');
  form.innerHTML = '';

  if (!item && kind === 'chooser') return;

  schema.fields.forEach((f) => {
    const wrap = el('div', 'field');
    wrap.appendChild(el('label', null, esc(f.label) + (f.required ? ' *' : '')));
    let input;
    const value = item?.[f.k] ?? extra[f.k] ?? '';

    if (f.type === 'select') {
      input = el('select');
      f.options().forEach((o) => {
        const opt = el('option', null, esc(o.t));
        opt.value = o.v;
        input.appendChild(opt);
      });
      input.value = value || (f.options()[0]?.v ?? '');
    } else if (f.type === 'textarea') {
      input = el('textarea');
      input.value = value;
    } else if (f.type === 'icon') {
      input = el('select');
      ICON_NAMES.forEach((g) => {
        const opt = el('option', null, g);
        opt.value = g;
        input.appendChild(opt);
      });
      input.value = value || 'globe';
      const preview = el('div', 'icon-preview');
      preview.innerHTML = iconHtml(input.value);
      input.addEventListener('change', () => { preview.innerHTML = iconHtml(input.value); });
      wrap.appendChild(preview);
    } else if (f.type === 'datalist') {
      input = el('input');
      input.value = value;
      const listId = 'dl-' + f.k;
      input.setAttribute('list', listId);
      const dl = el('datalist');
      dl.id = listId;
      f.options().forEach((o) => {
        const opt = el('option');
        opt.value = o;
        dl.appendChild(opt);
      });
      wrap.appendChild(dl);
    } else {
      input = el('input');
      input.value = value;
    }
    if (f.placeholder) input.placeholder = f.placeholder;
    input.dataset.key = f.k;
    wrap.appendChild(input);

  $('#overlay').classList.add('hidden');

/* Looks an item up in the current state, which another tab may have reloaded since the modal opened. */
function currentItem(kind, id) {
  if (kind === 'tile') {
    for (const env of state.environments) {
      const t = env.tiles.find((x) => x.id === id);
      if (t) return t;
    }
    return null;
  }
  if (kind === 'quickLink') return findQuickGroup(id);
  if (kind === 'quickSubLink') return findQuickItem(id)?.item || null;
  if (kind === 'environment') return state.environments.find((e) => e.id === id) || null;
  const key = { database: 'databases', resource: 'resources' }[kind];
  return state[key].find((x) => x.id === id) || null;
}

function saveModal() {
  if (!modalCtx || modalCtx.kind === 'chooser') return closeModal();
  const { kind } = modalCtx;
  const item = modalCtx.item ? currentItem(kind, modalCtx.item.id) : null;
  const schema = SCHEMAS[kind];
  const values = {};
  $('#modalForm').querySelectorAll('[data-key]').forEach((i) => { values[i.dataset.key] = i.value.trim(); });

  for (const f of schema.fields) {
    if (f.required && !values[f.k]) return toast(f.label + ' is required');
  }

  if (kind === 'noteName') return saveNoteAs(values.name);
  if (kind === 'tile') {
    const targetEnv = state.environments.find((e) => e.id === values.envId);
    if (!targetEnv) return toast('Pick an environment');
    if (item) {
      const owner = state.environments.find((e) => e.tiles.some((t) => t.id === item.id));
      if (owner && owner !== targetEnv) owner.tiles = owner.tiles.filter((t) => t.id !== item.id);
      Object.assign(item, { label: values.label, sub: values.sub, icon: values.icon, url: values.url });
      if (owner !== targetEnv && !targetEnv.tiles.includes(item)) targetEnv.tiles.push(item);
    } else {
      targetEnv.tiles.push({ id: uid(), label: values.label, sub: values.sub, icon: values.icon, url: values.url });
    }
  } else if (kind === 'quickLink') {
    if (item) Object.assign(item, { name: values.name, url: values.url });
    else state.quickLinks.push(normalizeQuickLink({ name: values.name, url: values.url }));
  } else if (kind === 'quickSubLink') {
    const target = findQuickGroup(values.parentId);
    if (!target) return toast('Pick a group');
    if (item) {
      const owner = findQuickItem(item.id)?.group;
      if (owner && owner !== target) owner.items = owner.items.filter((i) => i.id !== item.id);
      Object.assign(item, { name: values.name, url: values.url });
      if (!target.items.includes(item)) target.items.push(item);
    } else {
      target.items.push({ id: uid(), name: values.name, url: values.url });
    }
  } else if (kind === 'environment') {
    if (item) Object.assign(item, { name: values.name, short: values.short });
    else state.environments.push({ id: uid(), name: values.name, short: values.short, tiles: [] });
  } else {
    const key = { database: 'databases', resource: 'resources' }[kind];
    if (item) Object.assign(item, values);
    else state[key].push({ id: uid(), ...values });
  }

  save();
  closeModal();
  render();
  toast('Saved');
}

/* ---------- markdown (self-contained, escapes all raw HTML) ---------- */
function safeUrl(u, img) {
  u = u.trim().replace(/^<|>$/g, '');
  if (/^(https?:|mailto:|#|\/|\.\.?\/)/i.test(u)) return u;
  if (img && /^data:image\//i.test(u)) return u;
  if (!/^[a-z][a-z0-9+.-]*:/i.test(u)) return u;
  return '';
}
function slug(text) {
  return text.toLowerCase().replace(/<[^>]*>/g, '').replace(/[^\w\s-]/g, '').trim().replace(/\s+/g, '-');
}
function linkHtml(url, inner) {
  const u = safeUrl(url);
  if (!u) return inner;
  const ext = u.startsWith('#') ? '' : ' target="_blank" rel="noopener"';
  return `<a href="${esc(u)}"${ext}>${inner}</a>`;
}
function mdInline(src) {
  const stash = [];
  const hold = (html) => `\u0000${stash.push(html) - 1}\u0000`;
  let s = src;
  s = s.replace(/(`+)([\s\S]*?[^`])\1(?!`)/g, (_, __, code) => hold(`<code>${esc(code.trim())}</code>`));
  s = s.replace(/\\([\\`*_{}[\]()#+\-.!~=|>])/g, (_, c) => hold(esc(c)));
  s = s.replace(/!\[([^\]]*)\]\(\s*(<[^>]+>|[^)\s]+)(?:\s+"([^"]*)")?\s*\)/g, (_, alt, url, title) => {
    const u = safeUrl(url, true);
    return hold(u ? `<img src="${esc(u)}" alt="${esc(alt)}"${title ? ` title="${esc(title)}"` : ''}>` : esc(alt));
  });
  s = s.replace(/\[([^\]]+)\]\(\s*(<[^>]+>|[^)\s]+)(?:\s+"([^"]*)")?\s*\)/g, (_, text, url) => hold(linkHtml(url, mdInline(text))));
  s = s.replace(/<((?:https?:\/\/|mailto:)[^>\s]+)>/g, (_, url) => hold(linkHtml(url, esc(url))));
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<]*[^\s<).,;:!?'"])/g, (_, pre, url) => pre + hold(linkHtml(url, esc(url))));
  s = esc(s)
    .replace(/\*\*\*(?=\S)([\s\S]*?\S)\*\*\*/g, '<strong><em>$1</em></strong>')
    .replace(/\*\*(?=\S)([\s\S]*?\S)\*\*/g, '<strong>$1</strong>')
    .replace(/__(?=\S)([\s\S]*?\S)__/g, '<strong>$1</strong>')
    .replace(/\*(?=\S)([\s\S]*?\S)\*/g, '<em>$1</em>')
    .replace(/(^|[^\w])_(?=\S)([\s\S]*?\S)_(?!\w)/g, '$1<em>$2</em>')
    .replace(/~~(?=\S)([\s\S]*?\S)~~/g, '<del>$1</del>')
    .replace(/==(?=\S)([\s\S]*?\S)==/g, '<mark>$1</mark>')
    .replace(/\n/g, '<br>');
  return s.replace(/\u0000(\d+)\u0000/g, (_, i) => stash[i]);
}
const MD_FENCE = /^ {0,3}(`{3,}|~{3,})\s*([\w+#.-]*)/;
const MD_LIST = /^( *)([-*+]|\d+[.)])\s+(.*)$/;
const MD_TABLE_SEP = /^\s*\|?\s*:?-+:?\s*(\|\s*:?-+:?\s*)*\|?\s*$/;
function mdIsBlockStart(lines, i) {
  const l = lines[i];
  return MD_FENCE.test(l) || /^ {0,3}#{1,6}\s/.test(l) || /^ {0,3}>/.test(l) || MD_LIST.test(l) ||
    /^ {0,3}([-*_])(\s*\1){2,}\s*$/.test(l) ||
    (l.includes('|') && i + 1 < lines.length && MD_TABLE_SEP.test(lines[i + 1]));
}
function mdTableRow(l) {
  return l.trim().replace(/^\|/, '').replace(/\|$/, '').split(/(?<!\\)\|/).map((c) => c.trim().replace(/\\\|/g, '|'));
}
function mdList(lines, start) {
  const first = lines[start].match(MD_LIST);
  const indent = first[1].length;
  const ordered = /\d/.test(first[2]);
  const items = [];
  let i = start;
  while (i < lines.length) {
    const m = lines[i].match(MD_LIST);
    if (!m || m[1].length !== indent || /\d/.test(m[2]) !== ordered) break;
    const contentIndent = lines[i].length - m[3].length;
    const body = [m[3]];
    i++;
    while (i < lines.length) {
      const l = lines[i];
      const ind = l.match(/^ */)[0].length;
      if (!l.trim()) {
        const next = lines.slice(i + 1).find((x) => x.trim());
        if (next !== undefined && next.match(/^ */)[0].length > indent) { body.push(''); i++; continue; }
        break;
      }
      if (ind > indent) { body.push(l.slice(Math.min(ind, contentIndent))); i++; continue; }
      if (ind < indent || mdIsBlockStart(lines, i)) break;
      body.push(l.trim()); i++;
    }
    items.push(body);
  }
  const tag = ordered ? 'ol' : 'ul';
  const startNum = ordered ? parseInt(first[2], 10) : 1;
  const html = items.map((body) => {
    let text = body[0];
    let task = '';
    const t = text.match(/^\[([ xX])\]\s+(.*)$/);
    if (t) { task = `<input type="checkbox" disabled${t[1] !== ' ' ? ' checked' : ''}> `; text = t[2]; }
    const rest = body.slice(1);
    const para = [text];
    let j = 0;
    while (j < rest.length && rest[j].trim() && !mdIsBlockStart(rest, j)) para.push(rest[j++]);
    return `<li${task ? ' class="task"' : ''}>${task}${mdInline(para.join('\n'))}${mdBlocks(rest.slice(j))}</li>`;
  }).join('');
  return { html: `<${tag}${startNum !== 1 ? ` start="${startNum}"` : ''}>${html}</${tag}>`, next: i };
}
function mdBlocks(lines) {
  let out = '';
  let i = 0;
  while (i < lines.length) {
    const line = lines[i];
    if (!line.trim()) { i++; continue; }
    let m = line.match(MD_FENCE);
    if (m) {
      const fence = m[1];
      const buf = [];
      i++;
      while (i < lines.length && !lines[i].trim().startsWith(fence)) buf.push(lines[i++]);
      i++;
      out += `<pre><code${m[2] ? ` class="lang-${esc(m[2])}"` : ''}>${esc(buf.join('\n'))}</code></pre>`;
      continue;
    }
    m = line.match(/^ {0,3}(#{1,6})\s+(.*?)\s*#*\s*$/);
    if (m) {
      const html = mdInline(m[2]);
      out += `<h${m[1].length} id="${esc(slug(html))}">${html}</h${m[1].length}>`;
      i++;
      continue;
    }
    if (/^ {0,3}([-*_])(\s*\1){2,}\s*$/.test(line)) { out += '<hr>'; i++; continue; }
    if (/^ {0,3}>/.test(line)) {
      const buf = [];
      while (i < lines.length && lines[i].trim() && /^ {0,3}>/.test(lines[i])) buf.push(lines[i++].replace(/^ {0,3}> ?/, ''));
      out += `<blockquote>${mdBlocks(buf)}</blockquote>`;
      continue;
    }
    if (line.includes('|') && i + 1 < lines.length && MD_TABLE_SEP.test(lines[i + 1])) {
      const heads = mdTableRow(line);
      const aligns = mdTableRow(lines[i + 1]).map((c) =>
        c.startsWith(':') && c.endsWith(':') ? 'center' : c.endsWith(':') ? 'right' : c.startsWith(':') ? 'left' : '');
      const cell = (tag, c, k) => `<${tag}${aligns[k] ? ` style="text-align:${aligns[k]}"` : ''}>${mdInline(c || '')}</${tag}>`;
      i += 2;
      let body = '';
      while (i < lines.length && lines[i].trim() && lines[i].includes('|')) {
        const cells = mdTableRow(lines[i++]);
        body += `<tr>${heads.map((_, k) => cell('td', cells[k], k)).join('')}</tr>`;
      }
      out += `<table><thead><tr>${heads.map((h, k) => cell('th', h, k)).join('')}</tr></thead><tbody>${body}</tbody></table>`;
      continue;
    }
    if (MD_LIST.test(line)) {
      const r = mdList(lines, i);
      out += r.html;
      i = r.next;
      continue;
    }
    const buf = [line];
    i++;
    while (i < lines.length && lines[i].trim() && !mdIsBlockStart(lines, i)) buf.push(lines[i++]);
    out += `<p>${mdInline(buf.join('\n'))}</p>`;
  }
  return out;
}
function mdToHtml(src) {
  return mdBlocks(String(src || '').replace(/\r\n?/g, '\n').replace(/\t/g, '    ').split('\n'));
}

/* ---------- notes (markdown files kept in their own storage key) ---------- */
function loadNotes() {
  try {
    const list = JSON.parse(localStorage.getItem(NOTES_KEY) || '[]');
    return Array.isArray(list) ? list.map(normalizeNote) : [];
  } catch (e) {
    return [];
  }
}
function normalizeNote(n) {
  const now = Date.now();
  return { id: n.id || uid(), name: String(n.name || 'Untitled.md'), content: String(n.content || ''),
    created: Number(n.created) || now, updated: Number(n.updated) || now };
}
function saveNotes() {
  try {
    localStorage.setItem(NOTES_KEY, JSON.stringify(notes));
    return true;
  } catch (e) {
    toast('Browser storage is full — export a backup and delete old notes');
    return false;
  }
}
function fmtDate(ms) {
  return new Date(ms).toLocaleString(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' });
}
function cleanFileName(name) {
  let n = String(name || '').trim().replace(/[\\/:*?"<>|]+/g, '-');
  if (!n) return '';
  if (!/\.[a-z0-9]{1,10}$/i.test(n)) n += '.md';
  return n;
}
function uniqueName(name, exceptId) {
  const taken = (n) => notes.some((x) => x.id !== exceptId && x.name.toLowerCase() === n.toLowerCase());
  if (!taken(name)) return name;
  const dot = name.lastIndexOf('.');
  const base = dot > 0 ? name.slice(0, dot) : name;
  const ext = dot > 0 ? name.slice(dot) : '';
  let k = 2;
  while (taken(`${base} (${k})${ext}`)) k++;
  return `${base} (${k})${ext}`;
}

function renderNotes() {
  const wrap = $('#notesList');
  wrap.innerHTML = '';
  const add = el('button', 'note-card note-new', `<div class="note-page">${UI.plus}</div><div class="note-name">New note</div>`);
  add.type = 'button';
  add.addEventListener('click', () => openEditor(null));
  wrap.appendChild(add);
  [...notes].sort((a, b) => b.updated - a.updated)
    .filter((n) => matches(n.name, n.content))
    .forEach((n) => {
      const card = el('div', 'note-card');
      card.tabIndex = 0;
      card.title = n.name;
      card.innerHTML = `
        <div class="note-page"><div class="note-thumb md">${mdToHtml(n.content.slice(0, 1600))}</div></div>
        <div class="tile-actions">
          <span class="icon-btn" data-a="rename" title="Rename">${UI.edit}</span>
          <span class="icon-btn" data-a="del" title="Delete">${UI.trash}</span>
        </div>
        <div class="note-name">${esc(n.name)}</div>
        <div class="note-date">${esc(fmtDate(n.updated))}</div>`;
      card.addEventListener('click', (e) => {
        const a = e.target.closest('[data-a]')?.dataset.a;
        if (a === 'rename') return renameNote(n);
        if (a === 'del') return deleteNote(n);
        openEditor(n.id);
      });
      card.addEventListener('keydown', (e) => { if (e.key === 'Enter') openEditor(n.id); });
      wrap.appendChild(card);
    });
  $('#notesEmpty').classList.toggle('hidden', notes.length > 0);
}
function renameNote(n) {
  const next = cleanFileName(prompt('Rename file', n.name));
  if (!next || next === n.name) return;
  if (notes.some((x) => x.id !== n.id && x.name.toLowerCase() === next.toLowerCase())) return toast(`"${next}" already exists`);
  n.name = next;
  n.updated = Date.now();
  saveNotes(); render(); toast('Renamed');
}
function deleteNote(n) {
  if (!confirm(`Delete "${n.name}"? This cannot be undone.`)) return;
  notes = notes.filter((x) => x.id !== n.id);
  saveNotes(); render(); toast('Deleted');
}
function importMarkdownFiles(files) {
  const list = [...files].filter((f) => /\.(md|markdown|mdown|txt)$/i.test(f.name) || f.type.startsWith('text/'));
  if (!list.length) return toast('Pick a .md or .txt file');
  let done = 0;
  list.forEach((f) => {
    const reader = new FileReader();
    reader.onload = () => {
      const now = Date.now();
      notes.push({ id: uid(), name: uniqueName(cleanFileName(f.name)), content: String(reader.result), created: now, updated: now });
      if (++done === list.length) {
        saveNotes(); render();
        toast(list.length === 1 ? `Opened ${list[0].name}` : `Added ${list.length} files`);
        if (list.length === 1) openEditor(notes[notes.length - 1].id);
      }
    };
    reader.readAsText(f);
  });
}

/* editor */
let editor = null; // { id, name, saved, mode }
let previewFrame = 0;
function editorDirty() {
  return !!editor && $('#mdInput').value !== editor.saved;
}
function openEditor(id) {
  const n = id ? notes.find((x) => x.id === id) : null;
  editor = { id: n?.id || null, name: n?.name || '', saved: n?.content || '', mode: n ? 'read' : 'split' };
  $('#mdInput').value = editor.saved;
  $('#mdEditor').classList.remove('hidden');
  document.body.classList.add('editing');
  applySplit(Number(localStorage.getItem(SPLIT_KEY)) || 50);
  setEditorMode(editor.mode);
  updatePreview();
  updateEditorTitle();
  if (editor.mode !== 'read') $('#mdInput').focus();
}
function closeEditor(force) {
  if (!editor) return;
  if (!force && editorDirty() && !confirm('You have unsaved changes. Close without saving?')) return;
  editor = null;
  $('#mdEditor').classList.add('hidden');
  document.body.classList.remove('editing');
  $('#mdExportMenu').classList.add('hidden');
  render();
}
function setEditorMode(mode) {
  editor.mode = mode;
  $('#mdEditor').dataset.mode = mode;
  document.querySelectorAll('#mdModes button').forEach((b) => b.classList.toggle('active', b.dataset.mode === mode));
  if (mode !== 'read') $('#mdInput').focus();
}
function updateEditorTitle() {
  if (!editor) return;
  $('#mdName').textContent = editor.name || 'Untitled (not saved yet)';
  $('#mdDirty').classList.toggle('hidden', !editorDirty());
}
function updatePreview() {
  cancelAnimationFrame(previewFrame);
  previewFrame = requestAnimationFrame(() => {
    $('#mdPreview').innerHTML = mdToHtml($('#mdInput').value) ||
      '<p class="md-placeholder">Start typing Markdown on the left — the preview appears here.</p>';
    updateEditorTitle();
  });
}
function applySplit(pct) {
  const p = Math.min(85, Math.max(15, pct));
  $('#mdEditor').style.setProperty('--split', p + '%');
  return p;
}
function saveNote() {
  if (!editor) return;
  if (!editor.id) return openModal('noteName', null, { name: '' });
  const n = notes.find((x) => x.id === editor.id);
  if (!n) return openModal('noteName', null, { name: editor.name });
  n.content = $('#mdInput').value;
  n.updated = Date.now();
  if (!saveNotes()) return;
  editor.saved = n.content;
  updateEditorTitle(); toast(`Saved ${n.name}`);
}
function saveNoteAs(rawName) {
  const name = cleanFileName(rawName);
  if (!name) return toast('File name is required');
  const content = $('#mdInput').value;
  const now = Date.now();
  let target = notes.find((x) => x.name.toLowerCase() === name.toLowerCase());
  if (target && target.id !== editor.id && !confirm(`"${target.name}" already exists. Replace it?`)) return;
  if (target) {
    Object.assign(target, { name, content, updated: now });
  } else {
    target = { id: uid(), name, content, created: now, updated: now };
    notes.push(target);
  }
  if (!saveNotes()) return;
  Object.assign(editor, { id: target.id, name, saved: content });
  closeModal(); updateEditorTitle(); toast(`Saved ${name}`);
}
function download(name, text, type) {
  const a = el('a');
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}
function exportMarkdown() {
  const name = (editor.name || 'Untitled.md').replace(/\.[^.]+$/, '') + '.md';
  download(name, $('#mdInput').value, 'text/markdown');
}
function exportPdf() {
  const area = $('#printArea');
  area.innerHTML = `<article class="md">${mdToHtml($('#mdInput').value)}</article>`;
  const title = document.title;
  document.title = (editor.name || 'Untitled').replace(/\.[^.]+$/, '');
  window.print();
  document.title = title;
}
function wrapSelection(before, after = before, placeholder = 'text') {
  const ta = $('#mdInput');
  const { selectionStart: s, selectionEnd: e, value } = ta;
  const sel = value.slice(s, e) || placeholder;
  ta.setRangeText(before + sel + after, s, e, 'end');
  ta.setSelectionRange(s + before.length, s + before.length + sel.length);
  ta.focus(); updatePreview();
}
function prefixLines(prefix) {
  const ta = $('#mdInput');
  const { value } = ta;
  const s = value.lastIndexOf('\n', ta.selectionStart - 1) + 1;
  let e = value.indexOf('\n', ta.selectionEnd);
  if (e < 0) e = value.length;
  const block = value.slice(s, e).split('\n').map((l, k) => (typeof prefix === 'function' ? prefix(k) : prefix) + l).join('\n');
  ta.setRangeText(block, s, e, 'select');
  ta.focus(); updatePreview();
}
const MD_TOOLS = {
  h1: () => prefixLines('# '), h2: () => prefixLines('## '),
  bold: () => wrapSelection('**'), italic: () => wrapSelection('*'), strike: () => wrapSelection('~~'),
  code: () => wrapSelection('`', '`', 'code'),
  link: () => wrapSelection('[', '](https://)', 'link text'),
  ul: () => prefixLines('- '), ol: () => prefixLines((k) => `${k + 1}. `), task: () => prefixLines('- [ ] '),
  quote: () => prefixLines('> '),
  table: () => wrapSelection('\n| Column | Column |\n| --- | --- |\n| ', ' |  |\n', 'Cell'),
  hr: () => wrapSelection('\n---\n', '', '')
};

/* ---------- backup ---------- */
function exportData() {
  const blob = new Blob([JSON.stringify({ ...state, background: bg, notes }, null, 2)], { type: 'application/json' });
  const a = el('a');
  a.href = URL.createObjectURL(blob);
  a.download = `launchpad-backup-${new Date().toISOString().slice(0, 10)}.json`;
  a.click();
  URL.revokeObjectURL(a.href);
}
function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!confirm('Importing replaces the links, databases, resources and notes in this app with the backup. Continue?')) return;
      if (Array.isArray(data.notes)) { notes = data.notes.map(normalizeNote); saveNotes(); }
      state = {
        layoutVersion: LAYOUT_VERSION,
        quickLinks: (data.quickLinks || []).map(normalizeQuickLink),
        environments: data.environments || [],
        databases: data.databases || [],
        resources: data.resources || [],
        theme: THEMES.some((t) => t.id === data.theme) ? data.theme : state.theme
      };
      page = 0;
      if (data.background && typeof data.background.src === 'string') {
        bg = { src: data.background.src, blur: Number(data.background.blur) || 0 };
        saveBg();
        applyBackground();
      }
      applyTheme();
      save(); render(); toast('Backup imported');
    } catch (e) {
      toast('That file is not a valid backup');
    }
  };
  reader.readAsText(file);
}

/* ---------- wiring ---------- */
function setView(next) {
  view = next;
  document.querySelectorAll('.tab').forEach((t) => t.classList.toggle('active', t.dataset.view === view));
  document.querySelectorAll('.view').forEach((v) => v.classList.toggle('hidden', v.id !== 'view-' + view));
  render();
}
document.querySelectorAll('.tab').forEach((b) => {
  b.innerHTML = `<span class="tab-ic">${iconHtml(b.dataset.icon)}</span><span class="tab-label">${esc(b.textContent)}</span>`;
});
$('#settingsBtn').innerHTML = iconHtml('gear');
$('#settingsBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  const open = $('#appearance').classList.toggle('open');
  $('#settingsBtn').classList.toggle('active', open);
});
document.addEventListener('click', (e) => {
  if (!e.target.closest('#appearance, #settingsBtn')) {
    $('#appearance').classList.remove('open');
    $('#settingsBtn').classList.remove('active');
  }
});
$('#tabs').addEventListener('click', (e) => {
  const b = e.target.closest('.tab');
  if (b) setView(b.dataset.view);
});
$('#bgUpload').addEventListener('click', () => $('#bgFile').click());
$('#bgFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  try {
    setBackground(await imageFileToDataUrl(file));
  } catch (err) {
    toast('Could not read that image');
  }
});
$('#bgUrl').addEventListener('click', () => {
  const url = prompt('Image URL for the background', bg.src.startsWith('data:') ? '' : bg.src);
  if (url && url.trim()) setBackground(normalizeUrl(url.trim()));
});
$('#bgClear').addEventListener('click', () => setBackground(''));
$('#bgBlur').addEventListener('input', (e) => {
  bg.blur = Number(e.target.value);
  applyBackground();
});
$('#bgBlur').addEventListener('change', saveBg);
$('#prevPage').addEventListener('click', () => turnPage(-1));
$('#nextPage').addEventListener('click', () => turnPage(1));
$('#addBtn').addEventListener('click', () => {
  if (view === 'databases') return openModal('database');
  if (view === 'resources') return openModal('resource');
  if (view === 'notes') return openEditor(null);
  openChooser();
});
$('#search').addEventListener('input', (e) => { query = e.target.value.trim().toLowerCase(); render(); });
$('#modalClose').addEventListener('click', closeModal);
$('#modalCancel').addEventListener('click', closeModal);
$('#modalSave').addEventListener('click', saveModal);
$('#modalForm').addEventListener('submit', (e) => { e.preventDefault(); saveModal(); });
$('#modalForm').addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); saveModal(); }
});
$('#overlay').addEventListener('mousedown', (e) => { if (e.target.id === 'overlay') closeModal(); });
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') {
    $('#moreMenu').classList.add('hidden');
    if (modalCtx) closeModal();
    else if (!$('#mdExportMenu').classList.contains('hidden')) $('#mdExportMenu').classList.add('hidden');
    else if (editor) closeEditor();
  }
  if (editor && !modalCtx && (e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 's') {
    e.preventDefault();
    if (e.shiftKey) openModal('noteName', null, { name: editor.name });
    else saveNote();
  }
  if (view === 'launcher' && !modalCtx && !editor && document.activeElement !== $('#search')) {
    if (e.key === 'ArrowLeft') turnPage(-1);
    if (e.key === 'ArrowRight') turnPage(1);
  }
});
$('#moreBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  $('#moreMenu').classList.toggle('hidden');
});
document.addEventListener('click', () => $('#moreMenu').classList.add('hidden'));
$('#moreMenu').addEventListener('click', (e) => {
  const a = e.target.closest('button')?.dataset.action;
  if (a === 'export') exportData();
  if (a === 'notes') setView('notes');
  if (a === 'import') $('#importFile').click();
  if (a === 'reset') {
    if (confirm('Replace everything with the default layout? Export a backup first if unsure.')) {
      const theme = state.theme;
      state = defaults(); state.theme = theme; page = 0; save(); applyTheme(); render();
    }
  }
});
$('#bkExport').addEventListener('click', exportData);
$('#bkImport').addEventListener('click', () => $('#importFile').click());
$('#openMd').addEventListener('click', () => $('#mdFile').click());
$('#mdFile').addEventListener('change', (e) => {
  if (e.target.files.length) importMarkdownFiles(e.target.files);
  e.target.value = '';
});
$('#view-notes').addEventListener('dragover', (e) => { e.preventDefault(); });
$('#view-notes').addEventListener('drop', (e) => {
  e.preventDefault();
  if (e.dataTransfer.files.length) importMarkdownFiles(e.dataTransfer.files);
});
$('#mdBack').addEventListener('click', () => closeEditor());
$('#mdSave').addEventListener('click', saveNote);
$('#mdSaveAs').addEventListener('click', () => openModal('noteName', null, { name: editor.name }));
$('#mdModes').addEventListener('click', (e) => {
  const m = e.target.closest('button')?.dataset.mode;
  if (m) setEditorMode(m);
});
$('#mdTools').innerHTML = [
  ['h1', 'H1', 'Heading 1'], ['h2', 'H2', 'Heading 2'], ['bold', '<b>B</b>', 'Bold (Ctrl+B)'],
  ['italic', '<i>I</i>', 'Italic (Ctrl+I)'], ['strike', '<s>S</s>', 'Strikethrough'], ['code', '&lt;/&gt;', 'Inline code'],
  ['link', '&#128279;', 'Link (Ctrl+K)'], ['ul', '&bull;', 'Bulleted list'], ['ol', '1.', 'Numbered list'],
  ['task', '&#9744;', 'Task list'], ['quote', '&ldquo;', 'Quote'], ['table', '&#9638;', 'Table'], ['hr', '&mdash;', 'Divider']
].map(([t, label, title]) => `<button type="button" data-t="${t}" title="${title}">${label}</button>`).join('');
$('#mdTools').addEventListener('click', (e) => {
  const t = e.target.closest('button')?.dataset.t;
  if (t) MD_TOOLS[t]();
});
$('#mdInput').addEventListener('input', updatePreview);
$('#mdInput').addEventListener('keydown', (e) => {
  if (e.key === 'Tab') { e.preventDefault(); $('#mdInput').setRangeText('  ', $('#mdInput').selectionStart, $('#mdInput').selectionEnd, 'end'); updatePreview(); }
  if ((e.ctrlKey || e.metaKey) && !e.shiftKey) {
    const k = { b: 'bold', i: 'italic', k: 'link' }[e.key.toLowerCase()];
    if (k) { e.preventDefault(); MD_TOOLS[k](); }
  }
});
$('#mdInput').addEventListener('scroll', () => {
  if (editor?.mode !== 'split') return;
  const ta = $('#mdInput');
  const pv = $('#mdPreview');
  const r = ta.scrollTop / Math.max(1, ta.scrollHeight - ta.clientHeight);
  pv.scrollTop = r * (pv.scrollHeight - pv.clientHeight);
});
$('#mdPreview').addEventListener('click', (e) => {
  const a = e.target.closest('a[href^="#"]');
  if (!a) return;
  e.preventDefault();
  $('#mdPreview').querySelector(`[id="${CSS.escape(decodeURIComponent(a.getAttribute('href').slice(1)))}"]`)?.scrollIntoView({ behavior: 'smooth' });
});
$('#mdDivider').addEventListener('pointerdown', (e) => {
  const div = $('#mdDivider');
  div.setPointerCapture(e.pointerId);
  div.classList.add('dragging');
  const rect = $('#mdBody').getBoundingClientRect();
  let pct = 50;
  const move = (ev) => { pct = applySplit(((ev.clientX - rect.left) / rect.width) * 100); };
  const up = () => {
    div.classList.remove('dragging');
    div.removeEventListener('pointermove', move);
    div.removeEventListener('pointerup', up);
    localStorage.setItem(SPLIT_KEY, String(Math.round(pct)));
  };
  div.addEventListener('pointermove', move);
  div.addEventListener('pointerup', up);
});
$('#mdDivider').addEventListener('dblclick', () => { applySplit(50); localStorage.setItem(SPLIT_KEY, '50'); });
$('#mdExportBtn').addEventListener('click', (e) => {
  e.stopPropagation();
  $('#mdExportMenu').classList.toggle('hidden');
});
document.addEventListener('click', () => $('#mdExportMenu').classList.add('hidden'));
$('#mdExportMenu').addEventListener('click', (e) => {
  const x = e.target.closest('button')?.dataset.x;
  if (x === 'pdf') exportPdf();
  if (x === 'md') exportMarkdown();
});
window.addEventListener('beforeunload', (e) => {
  if (editorDirty()) { e.preventDefault(); e.returnValue = ''; }
});
$('#importFile').addEventListener('change', (e) => {
  if (e.target.files[0]) importData(e.target.files[0]);
  e.target.value = '';
});

/* Another tab saving the same app must not be overwritten by this tab's stale copy. */
window.addEventListener('storage', (e) => {
  if (e.key === BG_KEY) { bg = loadBg(); applyBackground(); return; }
  if (e.key === NOTES_KEY) { notes = loadNotes(); render(); return; }
  if (e.key !== STORE_KEY) return;
  state = load();
  applyTheme();
  render();
});

applyTheme();
applyBackground();
save();
render();

</script>
</body>
</html>
